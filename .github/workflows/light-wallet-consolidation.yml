name: Light Wallet consolidation

on:
  push:
    paths:
      - ".github/workflows/light-wallet-consolidation.yml"
      - "apps/web/src/pages/Send.tsx"
      - "apps/web/src/pages/History.tsx"
      - "apps/web/src/components/ApiStatusBar.tsx"
      - "apps/web/tests/readOnlyApiScan.mjs"
      - "apps/web/src/lib/consolidationPolicy.ts"
      - "apps/web/src/lib/consolidationAuto.ts"
      - "apps/web/tests/consolidationAuto.test.ts"
      - "apps/web/tests/i18nCoverage.test.mjs"
      - "apps/web/src/components/layout/Header.tsx"
      - "apps/web/src/pages/WalletHome.tsx"
      - "apps/web/src/locales/ru.ts"
      - "apps/web/tests/consolidationPolicy.test.ts"
      - "apps/web/package.json"
      - "apps/web/src/i18n.ts"
      - "packages/wallet-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install wallet-core dependencies
        run: npm ci --prefix packages/wallet-core
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Build wallet-core
        run: npm --prefix packages/wallet-core run build
      - name: Translation coverage
        run: npm --prefix apps/web run test:i18n
      - name: Consolidation policy tests
        run: npm --prefix apps/web run test:consolidation
      - name: Build web wallet
        run: npm --prefix apps/web run build
      - name: Reject legacy wallet API routes in browser bundle
        run: npm --prefix apps/web run scan:readonly-api
